<!--
    Basically all ClaudeAI Generated, with modifications to fit my style for the JS stuff

    To be honest, quite impressive. I did not choose the webpage look and feel, it did it on it's own!
-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dither Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg: #111;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #00ff99;
            --accent2: #ff4466;
            --text: #c2fff2;
            --muted: #556;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            min-height: 100vh;
            padding: 24px;
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.1em;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        h1 span { color: var(--muted); }

        .controls {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .upload-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: background 0.15s;
        }
        .upload-btn:hover { background: rgba(0,255,153,0.1); }

        #fileInput { display: none; }

        .status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .status.ok { color: var(--accent); }
        .status.err { color: var(--accent2); }

        .palette-select {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 10px;
            cursor: pointer;
        }

        .canvases {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 900px) {
            .canvases { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px;
        }

        .panel-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }
        .panel-title span { color: var(--accent); }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            background: #000;
        }

        .palette-swatches {
        }

        .info-row {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<h1>// DITHER_PREVIEW <span>— e-ink framebuffer tool</span></h1>

<div class="controls">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">[ LOAD IMAGE ]</button>
    <input type="file" id="fileInput" accept="image/*">

    <select class="palette-select" id="paletteSelect">
        <option value="waveshare">Palette: Waveshare</option>
        <option value="camera" selected>Palette: Camera-measured</option>
    </select>

    <div class="palette-swatches" id="swatches"></div>

    <span class="status" id="status">no image loaded</span>
</div>

<div class="canvases">
    <div class="panel">
        <div class="panel-title">01 / <span>ORIGINAL</span> — scaled + centered</div>
        <canvas id="canvasOriginal"></canvas>
        <div class="info-row" id="infoOriginal">—</div>
    </div>
    <div class="panel">
        <div class="panel-title">02 / <span>DITHERED</span> — floyd-steinberg + palette</div>
        <canvas id="canvasDithered"></canvas>
        <div class="info-row" id="infoDithered">—</div>
    </div>
</div>

<script src="imgProc.js"></script>

<script>
// @ts-check

/** @param {string} paletteKey */
function renderSwatches(paletteKey) {
    const palette = PALETTES[paletteKey].colors;
    const container = document.getElementById('swatches');
    if (!container) return;
    container.innerHTML = '';
    palette.forEach(([r, g, b]) => {
        const s = document.createElement('div');
        s.className = 'swatch';
        s.style.background = `rgb(${r},${g},${b})`;
        s.title = `rgb(${r},${g},${b})`;
        container.appendChild(s);
    });
}

/** @param {HTMLCanvasElement} src @param {HTMLCanvasElement} dest */
function copyToDisplay(src, dest) {
    dest.width = src.width;
    dest.height = src.height;
    const ctx = dest.getContext('2d');
    if (!ctx) return;
    ctx.translate(dest.width / 2, dest.height / 2);
    ctx.rotate(Math.PI);
    ctx.drawImage(src, -dest.width / 2, -dest.height / 2);
}

function setStatus(/** @type {string} */ msg, /** @type {'ok'|'err'|''} */ type = '') {
    const el = document.getElementById('status');
    if (!el) return;
    el.textContent = msg;
    el.className = 'status ' + type;
}

async function processImage() {
    const fileInput = /** @type {HTMLInputElement} */ (document.getElementById('fileInput'));
    const paletteKey = /** @type {HTMLSelectElement} */ (document.getElementById('paletteSelect')).value;

    if (!fileInput.files || fileInput.files.length === 0) return;
    const file = fileInput.files[0];

    setStatus('processing...', '');

    try {
        // Load image via canvas
        const img = await loadImage(file);

        const t0 = performance.now();
        const scaled = createCanvas(img);
        const t1 = performance.now();
        const palette = PALETTES[paletteKey].colors;
        const dithered = ditherImage(scaled, palette);
        const t2 = performance.now();
        const ditheredCanvas = imageFromQuantized(dithered, palette);

        const canvasOrig    = /** @type {HTMLCanvasElement} */ (document.getElementById('canvasOriginal'));
        const canvasDither  = /** @type {HTMLCanvasElement} */ (document.getElementById('canvasDithered'));

        copyToDisplay(scaled, canvasOrig);
        copyToDisplay(ditheredCanvas, canvasDither);

        document.getElementById('infoOriginal').textContent =
            `${img.naturalWidth}x${img.naturalHeight} → ${TARG_W}x${TARG_H}  |  scaled in ${(t1-t0).toFixed(1)}ms`;
        document.getElementById('infoDithered').textContent =
            `palette: ${PALETTES[paletteKey].label}  |  dithered in ${(t2-t1).toFixed(1)}ms`;

        setStatus(`done — ${file.name}`, 'ok');
    } catch(err) {
        console.error(err);
        setStatus('error: ' + err, 'err');
    }
}

document.getElementById('fileInput').addEventListener('change', processImage);
document.getElementById('paletteSelect').addEventListener('change', processImage);

renderSwatches(/** @type {HTMLSelectElement} */ (document.getElementById('paletteSelect')).value);
document.getElementById('paletteSelect').addEventListener('change', function() {
    renderSwatches(this.value);
});
</script>
</body>
</html>
